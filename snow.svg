<svg width="100%" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"></stop>
      <stop offset="100%" stop-color="#182848"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2"></feGaussianBlur>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"></rect>

  <!-- Luffy image -->
  <image href="YOUR_LUFFY_IMAGE_URL" x="350" y="20" width="300" height="260" preserveAspectRatio="xMidYMid meet"></image>

  <!-- Snow -->
  <g fill="white">

    <circle cx="50" cy="-10" r="4">
      <animate attributeName="cy" from="-10" to="310" dur="4s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="120" cy="-30" r="3">
      <animate attributeName="cy" from="-30" to="310" dur="5s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="200" cy="-20" r="5">
      <animate attributeName="cy" from="-20" to="310" dur="6s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="280" cy="-50" r="3">
      <animate attributeName="cy" from="-50" to="310" dur="4.5s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="360" cy="-10" r="4">
      <animate attributeName="cy" from="-10" to="310" dur="5.5s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="450" cy="-40" r="5">
      <animate attributeName="cy" from="-40" to="310" dur="4s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="550" cy="-20" r="3">
      <animate attributeName="cy" from="-20" to="310" dur="6s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="650" cy="-60" r="4">
      <animate attributeName="cy" from="-60" to="310" dur="5s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="750" cy="-20" r="5">
      <animate attributeName="cy" from="-20" to="310" dur="4s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="850" cy="-40" r="3">
      <animate attributeName="cy" from="-40" to="310" dur="5.5s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="950" cy="-10" r="4">
      <animate attributeName="cy" from="-10" to="310" dur="4.5s" repeatCount="indefinite"></animate>
    </circle>

  </g>

  <!-- Snow glow -->
  <g fill="white" opacity="0.5" filter="url(#glow)">
    <circle cx="150" cy="100" r="8"></circle>
    <circle cx="500" cy="150" r="8"></circle>
    <circle cx="800" cy="80" r="8"></circle>
  </g>

</svg>